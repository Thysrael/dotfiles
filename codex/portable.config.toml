model = "gpt-5.6-sol"
model_provider = "openai-horizon"
model_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[model_providers.openai-horizon]
name = "OpenAI Horizon"
base_url = "https://api.horizon1123.top/v1"
env_key = "OPENAI_HORIZON_API_KEY"
wire_api = "responses"
request_max_retries = 4
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }

[mcp_servers.gh_grep]
url = "https://mcp.grep.app"

[mcp_servers.gh_grep.tools.searchGitHub]
approval_mode = "approve"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[tui]
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "current-dir", "context-used"]
status_line_use_colors = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
